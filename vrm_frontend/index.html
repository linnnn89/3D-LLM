<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>由比滨结衣 - Open-LLM-VTuber 3D</title>
  <link rel="stylesheet" href="./style.css">
  
  <script type="importmap">
  {
    "imports": {
      "three": "./libs/three.module.js",
      "three/addons/": "./libs/",
      "@pixiv/three-vrm": "./libs/three-vrm.module.min.js",
      "@pixiv/three-vrm-animation": "./libs/three-vrm-animation.module.min.js"
    }
  }
  </script>
</head>
<body>
  <!-- Loading Screen -->
  <div id="loading-screen" class="loading-screen">
    <div class="spinner"></div>
    <div id="loading-status" class="loading-text">正在初始化 3D 引擎...</div>
  </div>

  <!-- 3D Canvas Viewport -->
  <div id="canvas-container"></div>

  <!-- UI Overlay -->
  <div class="ui-layer">
    <!-- Header -->
    <header class="header-bar">
      <div class="character-card clickable">
        <div id="character-avatar" class="character-avatar">结</div>
        <div class="character-info">
          <h2 id="character-title">由比滨结衣</h2>
          <div class="character-status">
            <span id="status-dot" class="status-dot"></span>
            <span id="status-text">连接中...</span>
          </div>
        </div>
      </div>

      <div class="header-actions clickable">
        <button id="btn-reset-cam" class="btn-icon" title="重置视角">
          <span>🎯 视角重置</span>
        </button>
        <button id="btn-settings" class="btn-icon btn-settings" title="全局设置：LLM / 密钥 / 记忆 / 存储">
          <span>⚙️ 全局设置</span>
        </button>
        <button id="btn-character" class="btn-icon" title="角色设置：人设 / 声音 / 3D 形象">
          <span>👤 角色设置</span>
        </button>
        <select id="config-select" class="btn-icon" title="切换角色配置">
          <option value="zh_喜多郁代.yaml">喜多郁代 (Kira)</option>
          <option value="zh_由比滨结衣.yaml">由比滨结衣</option>
          <option value="zh_雷电将军.yaml">雷电将军</option>
          <option value="zh_依蕾娜.yaml">依蕾娜 (Elaina)</option>
        </select>
        <select id="motion-select" class="btn-icon" title="肢体动作打样演示">
          <option value="">🎭 动作演示打样...</option>
          <option value="greeting">🌟 官方全身打招呼 (Pixiv)</option>
          <option value="wave_hand">👋 轻柔摆手招手 (日常)</option>
          <option value="shake_head">🙅 轻轻摇头 (傲娇/否定)</option>
          <option value="gentle_nod">🙇 赞同点头 (倾听)</option>
          <option value="cheerful_bounce">✨ 喜多元气跳 (开心)</option>
          <option value="surprise_jump">😲 受惊后缩 (惊讶)</option>
          <option value="pout_turn">😤 傲娇侧头 (生气)</option>
          <option value="shy_tilt">💕 歪头害羞 (萌态)</option>
        </select>
      </div>
    </header>

    <!-- Center Dialogue & Subtitles -->
    <main class="center-content">
      <div id="dialogue-bubble" class="dialogue-bubble">
        <div id="bubble-sender" class="bubble-sender">由比滨结衣</div>
        <div id="bubble-text" class="bubble-text">呀吼~！我是由比滨结衣！今天想聊点什么呢？</div>
        <div id="user-transcript" class="user-transcript" style="display: none;"></div>
      </div>
    </main>

    <!-- Bottom Dock -->
    <footer class="bottom-dock clickable">
      <!-- Quick Chips -->
      <div class="suggestion-chips">
        <button class="chip" data-text="呀吼~！结衣，打个招呼吧！">✨ 呀吼~</button>
        <button class="chip" data-text="你能介绍一下侍奉部和你的朋友们吗？">🏫 侍奉部介绍</button>
        <button class="chip" data-text="你今天过得怎么样呀？">🌸 今天过得怎样？</button>
      </div>

      <!-- Input Bar -->
      <div class="input-container">
        <input id="text-input" class="text-input" type="text" placeholder="和由比滨结衣聊点什么吧... (按 Enter 发送)" />
        <button id="btn-send" class="btn-send" title="发送消息">➤</button>
        <button id="btn-mic" class="btn-mic" title="语音输入 (按一下开始，再按停止)">🎙️</button>
        <button id="btn-interrupt" class="btn-interrupt" title="打断说话">⏹️</button>
      </div>
    </footer>

  <script type="module" src="./app.js"></script>
</body>
</html>
